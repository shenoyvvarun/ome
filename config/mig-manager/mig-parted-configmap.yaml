apiVersion: v1
kind: ConfigMap
metadata:
  name: mig-parted-config
  namespace: ome
data:
  config.yaml: |
    version: v1
    mig-configs:
      all-disabled:
      - devices: all
        mig-enabled: false

      all-2g.20gb:
      - devices: all
        mig-enabled: true
        mig-devices:
          "2g.20gb": 7
